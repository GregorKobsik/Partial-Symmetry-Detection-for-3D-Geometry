name: symcl
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.8.0        # CUDA 12.8 build: pip install torch --index-url https://download.pytorch.org/whl/cu128
      - pytorch-lightning==1.9.5
      - pytorch-metric-learning==2.9.0
      - potpourri3d==1.3
      - hdbscan==0.8.40
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.7.1
      - matplotlib==3.10.6
      - tqdm==4.67.3
      - trimesh==4.8.1
      - networkx==3.4.2
      - k3d==2.17.0         # only for the visualization notebooks
      # PyTorch3D has no official wheel for every torch/CUDA combo; build from source:
      #   pip install "git+https://github.com/facebookresearch/pytorch3d.git@v0.7.9"
